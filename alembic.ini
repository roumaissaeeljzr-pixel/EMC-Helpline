[alembic]
script_location = alembic

# L'URL de connexion N'EST PAS codée en dur ici -- elle est lue
# depuis DATABASE_URL (fichier .env) dans alembic/env.py, pour ne
# jamais commettre d'identifiants dans le dépôt.
sqlalchemy.url =

prepend_sys_path = .

version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S